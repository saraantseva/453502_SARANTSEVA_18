{% extends 'core/base.html' %}

{% block content %}
<h1 class="page-title">Регистрация (для клиентов)</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label>{{ field.label }} 
                    {% if field.field.required %}<span style="color: #e94560;">*</span>{% endif %}
                </label>
                {{ field }}
                {% if field.errors %}
                    <div style="color: red; font-size: 0.8rem;">{{ field.errors }}</div>
                {% endif %}
                {% if field.help_text %}
                    <small style="color: #888;">{{ field.help_text }}</small>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="button">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
