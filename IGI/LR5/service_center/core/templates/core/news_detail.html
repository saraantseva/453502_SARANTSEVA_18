{% extends 'core/base.html' %}

{% block content %}
<a href="{% url 'core:news_list' %}" class="button" style="background-color: #6c757d; margin-bottom: 20px; display: inline-block;">← Все новости</a>

<div class="card">
    <h1 class="page-title">{{ news.title }}</h1>
    
    {% if news.image %}
        <img src="{{ news.image.url }}" alt="{{ news.title }}" style="max-width: 100%; height: auto; margin: 15px 0; border-radius: 4px;">
    {% endif %}
    
    <hr>
    <p>{{ news.content|linebreaks }}</p>
    
    <div style="margin-top: 20px; font-size: 0.7rem; color: #888; border-top: 1px solid #e2e8f0; padding-top: 10px;">
        <p>Дата создания (UTC): {{ news_created_utc }}</p>
        <p>Дата создания (ваш часовой пояс, {{ user_timezone }}): {{ news_created_local }}</p>
    </div>
</div>

{% endblock %}
