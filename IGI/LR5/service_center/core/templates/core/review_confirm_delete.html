{% extends 'core/base.html' %}

{% block content %}
<h1>Удаление отзыва</h1>
<p>Вы уверены, что хотите удалить этот отзыв?</p>
<p><strong>{{ review.text|truncatechars:100 }}</strong></p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'core:reviews' %}">Отмена</a>
</form>
{% endblock %}
